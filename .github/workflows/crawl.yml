name: crawl-candidates
# Crawl every 4 hours for open-source games that could join the catalog. It never touches games/:
# results go to the `crawler-data` branch for human review.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      max_new:
        description: "Max repositories to inspect in this run"
        default: "30"

permissions:
  contents: write

# One run at a time: every run republishes the crawler-data branch.
concurrency:
  group: crawl-candidates
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Restore previous crawler state
        run: |
          git fetch origin crawler-data --depth 1 || exit 0
          mkdir -p crawl-output
          git archive FETCH_HEAD | tar -x -C crawl-output

      - name: Crawl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/crawler/crawl.mjs --max-new "${{ inputs.max_new || 30 }}"

      - name: Summary of what needs attention
        run: node tools/crawler/summary.mjs crawl-output >> "$GITHUB_STEP_SUMMARY"

      - name: Publish results to crawler-data
        run: |
          cd crawl-output
          git init -q && git checkout -q -b crawler-data
          git config user.name "vapor-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -q -m "crawl $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" crawler-data

      - name: Summary
        run: |
          node -e '
            const i = require("./crawl-output/index.json");
            const c = {}; for (const r of i) c[r.status] = (c[r.status] || 0) + 1;
            console.log("### Candidates by status");
            for (const k in c) console.log("- " + k + ": " + c[k]);
            const top = i.filter((r) => ["needs-asset-audit", "byo-only"].includes(r.status)).slice(0, 20);
            console.log("\n### To review (top " + top.length + ")");
            console.log("| repo | status | license | stars |\n|---|---|---|---|");
            for (const r of top) console.log("| [" + r.repo + "](https://github.com/" + r.repo + ") | " + r.status + " | " + (r.license ?? "-") + " | " + r.stars + " |");
          ' >> "$GITHUB_STEP_SUMMARY"
