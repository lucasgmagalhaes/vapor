name: ci
on:
  # workflow_dispatch lets the pipeline start CI on branches it creates: events caused by GITHUB_TOKEN
  # (pushes, PRs) do not trigger workflows, but a workflow_dispatch does.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace
      - run: cargo run -q -p vapor-cli -- validate .
      - name: Re-audit every listed artifact against its record
        # Downloads each Release zip named in games/*/game.json, re-runs the security scan
        # and fails if the zip no longer matches audits/<slug>.json (hash, size or findings).
        run: |
          set -euo pipefail
          for f in games/*/game.json; do
            slug=$(jq -r .slug "$f"); url=$(jq -r .artifact.url "$f")
            curl -fsSL --retry 3 -o "/tmp/$slug.zip" "$url"
            cargo run -q -p vapor-cli -- audit "/tmp/$slug.zip" --slug "$slug"
          done
      - name: Reject binaries/large files in games/
        run: |
          if find games -type f -size +512k | grep .; then echo "large file in games/"; exit 1; fi
          if find games -type f ! -name game.json ! -name cover.webp | grep .; then echo "only game.json and cover.webp are allowed"; exit 1; fi
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/pipeline/package-lock.json
      - name: Crawler tests (asset-license audit)
        run: node --test tools/crawler/license-audit.test.mjs
      - name: Link checker tests
        run: node --test tools/links/check.test.mjs
      - name: Pipeline tests (smoke helpers, manifest, link and build-workflow generators, auto PRs)
        run: cd tools/pipeline && npm ci --no-audit --no-fund && npm test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node --experimental-strip-types --test tools/ui/progress.test.ts
  tauri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: cargo check --manifest-path backend/Cargo.toml
